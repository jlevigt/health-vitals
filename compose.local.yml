services:
  # --- Infrastructure ---
  postgres:
    image: "postgres:18-alpine"
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - internal

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - internal
    env_file:
      - .env

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - internal
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"

  # --- Reverse Proxy (Simulating VPS) ---
  traefik:
    image: traefik:v3.0
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080" # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal

  # --- Apps ---
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
    depends_on:
      - rabbitmq
      - minio
      - postgres
    env_file:
      - .env
    networks:
      - internal

  worker:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    depends_on:
      - postgres
      - rabbitmq
      - minio
    env_file:
      - .env
    networks:
      - internal

networks:
  internal: