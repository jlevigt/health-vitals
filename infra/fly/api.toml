# Fly.io configuration for Health Vitals API
# Deploy from repo root:
#   fly deploy --config infra/fly/api.toml --dockerfile apps/api/Dockerfile .

app = "health-vitals-api"
primary_region = "iad"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  STORAGE_BUCKET = "health-vitals-uploads"
  LLM_PROVIDER = "google"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
