services:
  rabbitmq:
    image: rabbitmq:3-management
    networks:
      - prod01
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    deploy:
      replicas: 1
      labels:
        # Management UI
        - "traefik.enable=true"
        - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.binderlex.com`)"
        - "traefik.http.routers.rabbitmq.entrypoints=websecure"
        - "traefik.http.routers.rabbitmq.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio_data:/data
    networks:
      - prod01
    deploy:
      replicas: 1
      labels:
        # S3 API
        - "traefik.http.routers.minio.rule=Host(`s3.binderlex.com`)"
        - "traefik.http.routers.minio.entrypoints=websecure"
        - "traefik.http.routers.minio.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.minio.loadbalancer.server.port=9000"
        # Console
        - "traefik.http.routers.minio-console.rule=Host(`console.s3.binderlex.com`)"
        - "traefik.http.routers.minio-console.entrypoints=websecure"
        - "traefik.http.routers.minio-console.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.minio-console.loadbalancer.server.port=9001"

volumes:
  rabbitmq_data:
  minio_data:

networks:
  prod01:
    external: true
