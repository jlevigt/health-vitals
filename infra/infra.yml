services:
  rabbitmq:
    image: rabbitmq:3-management
    networks:
      - prod01
    ports:
      - "15672:15672" # UI local
      - "5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    env_file:
      - ../.env

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    networks:
      - prod01
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ../.env
    environment:
      - MINIO_ROOT_USER=${STORAGE_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${STORAGE_SECRET_KEY}
      - MINIO_API_CORS_ALLOW_ORIGIN="*" 
    volumes:
      - minio_data:/data

  postgres:
    image: "postgres:18-alpine"
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    networks:
      - prod01

volumes:
  rabbitmq_data:
  minio_data:

networks:
  prod01:
    external: true
