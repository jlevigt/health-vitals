services:
  migrator:
    image: jlevigt/my-apps:migrator-latest
    networks:
      - prod01
    deploy:
      restart_policy:
        condition: none
    environment:
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_REGION: ${STORAGE_REGION}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}

networks:
  prod01:
    external: true
