version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-alpine # No management plugin
    container_name: rabbitmq
    hostname: rabbitmq
    # No ports exposed to host, only internal network
    # ports:
    #   - "5672:5672" 
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - prod01
    env_file:
      - ../.env.local
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      # Console port 9001 removed as requested
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    volumes:
      - minio_data:/data
    networks:
      - prod01
    env_file:
      - ../.env.local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local

networks:
  prod01: 
    external: true
