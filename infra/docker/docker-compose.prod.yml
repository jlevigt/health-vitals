name: health-data-app

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: health-api
    # Entrypoint is defined in Dockerfile, so it will run migrations/buckets then start
    restart: always
    env_file:
      - ../.env.production
    depends_on:
      - rabbitmq
      - minio

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    container_name: health-worker
    restart: always
    env_file:
      - ../.env.production
    depends_on:
      - rabbitmq
      - minio

  nginx:
    image: nginx:alpine
    container_name: health-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  rabbitmq_data:
  minio_data:
