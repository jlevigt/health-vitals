name: "health-data-app"

services:
  postgres_dev:
    container_name: "postgres-dev"
    image: "postgres:18-alpine"
    shm_size: 128m
    env_file:
      - ../../.env.local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.dev
    container_name: "health-api"
    command: bun run dev:api
    ports:
      - "3000:3000"
    depends_on:
      postgres_dev:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ../../.env.local
    environment:
      - POSTGRES_HOST=postgres_dev
      - RABBITMQ_HOST=rabbitmq
      - STORAGE_ENDPOINT=http://minio:9000
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_dev:5432/${POSTGRES_DB}
    volumes:
      - ../../:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/libs/shared/node_modules # generic match for shared libs if they exist
    networks:
      - default

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile.dev
    container_name: "health-worker"
    command: bun run dev:worker
    depends_on:
      postgres_dev:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ../../.env.local
    environment:
      - POSTGRES_HOST=postgres_dev
      - RABBITMQ_HOST=rabbitmq
      - STORAGE_ENDPOINT=http://minio:9000
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_dev:5432/${POSTGRES_DB}
    volumes:
      - ../../:/app
      - /app/node_modules
      - /app/apps/worker/node_modules
      - /app/libs/shared/node_modules
    networks:
      - default

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local

networks:
  default:
    driver: bridge
