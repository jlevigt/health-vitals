name: 🏗 Task
description: A small, atomic unit of work.
labels: ["type:feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is the desired outcome?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Allowed Scope
      description: What packages/files are allowed to be touched? Explicitly state what NOT to touch.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk Classification
      options:
        - Low (UI/minor logic)
        - Medium (API changes/new endpoints)
        - High (Auth/DB/Core Logic)
    validations:
      required: true
  - type: textarea
    id: operational-impact
    attributes:
      label: Operational Impact
      description: Does this require a migration? Is there any downtime risk?
