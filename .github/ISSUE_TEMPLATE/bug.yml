name: 🐛 Bug Report
description: Report a bug to be fixed.
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: How do we reproduce this? (Include code snippets if possible)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Local, Staging, or Production?
