name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: local_user
          POSTGRES_PASSWORD: local_password
          POSTGRES_DB: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run Migrations
        run: bun run migration:run
        env:
          DATABASE_URL: postgres://local_user:local_password@localhost:5432/dev
          NODE_ENV: test
          SECRET_JWT_KEY: test_secret
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_REGION: us-east-1
          STORAGE_ACCESS_KEY: test
          STORAGE_SECRET_KEY: test
          RABBITMQ_URL: amqp://localhost:5672

      - name: Run Tests
        run: bun run test
        env:
          DATABASE_URL: postgres://local_user:local_password@localhost:5432/dev
          NODE_ENV: test
          SECRET_JWT_KEY: test_secret
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_REGION: us-east-1
          STORAGE_ACCESS_KEY: test
          STORAGE_SECRET_KEY: test
          RABBITMQ_URL: amqp://localhost:5672

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4

      - name: Build API Image
        run: docker build -t health-vitals-api -f apps/api/Dockerfile .

      - name: Build Worker Image
        run: docker build -t health-vitals-worker -f apps/worker/Dockerfile .

      - name: Build Migrator Image
        run: docker build -t health-vitals-migrator -f apps/jobs/migrator/Dockerfile .

      - name: Build Web Image
        run: docker build -t health-vitals-web -f apps/web/Dockerfile .
