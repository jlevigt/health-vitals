openapi: 3.0.0
info:
  title: Health Data API
  description: API for managing health reports and observations with LLM-powered extraction.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        is_active:
          type: boolean
    
    File:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        status:
          type: string
          enum: [pending_upload, processing, completed, failed]
        created_at:
          type: string
          format: date-time

    Report:
      type: object
      properties:
        id:
          type: string
          format: uuid
        file_id:
          type: string
          format: uuid
        collection_date:
          type: string
          format: date
        lab_name:
          type: string
          nullable: true
        observations_count:
          type: integer

    Observation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
        canonical_name:
          type: string
        raw_name:
          type: string
        raw_value:
          type: string
        raw_unit:
          type: string
          nullable: true
        normalized_value:
          type: number
          nullable: true
        base_unit:
          type: string
        reference_low:
          type: number
          nullable: true
        reference_high:
          type: number
          nullable: true
        loinc_code:
          type: string
          nullable: true
        material:
          type: string
          nullable: true

    DashboardPoint:
      type: object
      properties:
        canonical_name:
          type: string
        collected_date:
          type: string
          format: date
        normalized_value:
          type: number
          nullable: true
        reference_low:
          type: number
          nullable: true
        reference_high:
          type: number
          nullable: true

    Error:
      type: object
      properties:
        message:
          type: string
        statusCode:
          type: integer

paths:
  /health:
    get:
      summary: Health Check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  uptime:
                    type: number
                  message:
                    type: string
                  timestamp:
                    type: integer
                  db:
                    type: string
                    enum: [connected, disconnected]

  # ==================== AUTH ====================
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
      responses:
        '201':
          description: User created, verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'

  /auth/login:
    post:
      summary: Login with email and password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Success, returns access token and sets refresh token cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  accessToken:
                    type: string
        '401':
          description: Invalid credentials or unverified email

  /auth/logout:
    post:
      summary: Logout and invalidate session
      tags: [Auth]
      responses:
        '200':
          description: Logged out successfully

  /auth/refresh:
    post:
      summary: Refresh access token using refresh token cookie
      tags: [Auth]
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '401':
          description: Invalid or expired refresh token

  /auth/verify-email:
    post:
      summary: Verify email with token (POST body)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token]
              properties:
                email:
                  type: string
                token:
                  type: string
      responses:
        '200':
          description: Email verified
    get:
      summary: Verify email with token (query params - for email links)
      tags: [Auth]
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified

  /auth/password/recovery/request:
    post:
      summary: Request password recovery email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Recovery email sent if account exists

  /auth/password/reset:
    post:
      summary: Reset password using recovery token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, newPassword]
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Password reset successfully
        '400':
          description: Invalid or expired token

  /auth/password/change:
    post:
      summary: Change password (authenticated)
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Password changed successfully
        '401':
          description: Current password incorrect

  # ==================== FILES ====================
  /files/uploads:
    post:
      summary: Request signed URLs for file upload
      description: Returns pre-signed S3 URLs for direct browser upload
      tags: [Files]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: object
                    required: [filename, contentType]
                    properties:
                      filename:
                        type: string
                      contentType:
                        type: string
      responses:
        '200':
          description: Signed URLs for upload
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploads:
                    type: array
                    items:
                      type: object
                      properties:
                        fileId:
                          type: string
                          format: uuid
                        uploadUrl:
                          type: string
                          format: uri
                        expiresAt:
                          type: string
                          format: date-time

  /files/{file_id}/upload-complete:
    post:
      summary: Confirm file upload completed
      description: Triggers processing pipeline for the uploaded file
      tags: [Files]
      security:
        - bearerAuth: []
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: File queued for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [processing]

  /files:
    get:
      summary: List user's files
      tags: [Files]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending_upload, processing, completed, failed]
      responses:
        '200':
          description: List of files
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/File'

  # ==================== REPORTS ====================
  /reports:
    get:
      summary: List user's reports
      tags: [Reports]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: '#/components/schemas/Report'

  /reports/{id}/observations:
    get:
      summary: Get observations for a specific report
      tags: [Reports]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of observations
          content:
            application/json:
              schema:
                type: object
                properties:
                  reportId:
                    type: string
                    format: uuid
                  observations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Observation'
        '404':
          description: Report not found

  # ==================== DASHBOARDS ====================
  /dashboards/{category}:
    get:
      summary: Get dashboard data for a category
      description: Returns historical observation data for dashboard visualization
      tags: [Dashboards]
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [lipid_panel, glucose_metabolism, renal_function]
      responses:
        '200':
          description: Dashboard data points
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    type: string
                  points:
                    type: array
                    items:
                      $ref: '#/components/schemas/DashboardPoint'
