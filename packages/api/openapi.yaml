openapi: 3.0.0
info:
  title: Health Data API
  description: API for managing health reports and observations with LLM-powered extraction.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        is_active:
          type: boolean
    
    Observation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
        canonical_name:
          type: string
        raw_name:
          type: string
        raw_value:
          type: string
        raw_unit:
          type: string
          nullable: true
        normalized_value:
          type: number
          nullable: true
        base_unit:
          type: string
        reference_low:
          type: number
          nullable: true
        reference_high:
          type: number
          nullable: true
        loinc_code:
          type: string
          nullable: true
        material:
          type: string
          nullable: true

    Error:
      type: object
      properties:
        message:
          type: string
        statusCode:
          type: integer

paths:
  /health:
    get:
      summary: Health Check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  accessToken:
                    type: string
        '401':
          description: Unauthorized

  /auth/verify-email:
    post:
      summary: Verify email with token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token]
              properties:
                email:
                  type: string
                token:
                  type: string
      responses:
        '200':
          description: Email verified
    get:
      summary: Verify email via query params
      tags: [Auth]
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified

  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string

  /auth/logout:
    post:
      summary: Logout
      tags: [Auth]
      responses:
        '200':
          description: Logged out

  /reports/upload:
    post:
      summary: Upload a PDF report
      tags: [Reports]
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Report processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  reportId:
                    type: string
                    format: uuid
                  collectionDate:
                    type: string
                  labName:
                    type: string
                    nullable: true
                  observationsCount:
                    type: integer

  /reports/{id}/observations:
    get:
      summary: List observations for a report
      tags: [Reports]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of observations
          content:
            application/json:
              schema:
                type: object
                properties:
                  reportId:
                    type: string
                    format: uuid
                  observations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Observation'

  /dashboard/lipid_panel:
    get:
      summary: Get lipid panel historical data
      tags: [Dashboard]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        canonical_name:
                          type: string
                        collected_date:
                          type: string
                        normalized_value:
                          type: number
                          nullable: true
